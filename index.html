<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Сканер маркировки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .header { padding: 16px; text-align: center; background: #1e293b; border-bottom: 1px solid #334155; }
    .header h3 { margin: 0 0 14px; }
    .scan-btn { background: #10b981; color: #fff; border: none; padding: 18px 24px; font-size: 18px; border-radius: 12px; width: 90%; font-weight: bold; }
    .test-btn { background: #334155; margin-top: 8px; font-size: 15px; padding: 12px; }
    #status { margin-top: 10px; font-size: 12px; opacity: .8; min-height: 16px; word-break: break-word; }
    .scan-panel { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .scan-item { background: #1e293b; padding: 12px; border-radius: 8px; border-left: 4px solid #10b981; font-size: 14px; }
    .scan-item.loading { border-left-color: #64748b; }
    .scan-item.duplicate { background: #451a1a; border-left-color: #ef4444; }
    .scan-item.error { background: #3b2a0a; border-left-color: #f59e0b; }
    .code { font-size: 11px; opacity: .7; word-break: break-all; }
    .msg { font-weight: bold; margin: 4px 0; }
    .det { font-size: 12px; opacity: .9; word-break: break-all; }

    #cam { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
    #cam.open { display: block; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    .frame { position: absolute; top: 50%; left: 50%; width: 65vmin; height: 65vmin; transform: translate(-50%, -50%);
             border: 3px solid rgba(255,255,255,.9); border-radius: 16px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
    .frame.hit { border-color: #10b981; border-width: 6px; }
    .cam-top { position: absolute; top: 0; left: 0; right: 0; padding: 16px; text-align: center; font-size: 15px; }
    #fps { font-size: 11px; opacity: .6; margin-top: 4px; }
    .cam-bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; display: flex; gap: 10px; flex-direction: column; align-items: center; }
    #camResult { min-height: 44px; width: 92%; padding: 10px; border-radius: 10px; background: rgba(15,23,42,.85); font-size: 14px; text-align: center; word-break: break-all; }
    .cam-btns { display: flex; gap: 10px; width: 92%; }
    .cam-btns button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; color: #fff; }
    #torchBtn { background: #334155; }
    #closeBtn { background: #ef4444; }
  </style>
</head>
<body>

  <div class="header">
    <h3>Сканер маркировки</h3>
    <button class="scan-btn" id="scanBtn">📷 Сканировать</button>
    <button class="scan-btn test-btn" id="testBtn">🧪 Тест отправки</button>
    <div id="status"></div>
  </div>

  <div class="scan-panel" id="itemsList"></div>

  <div id="cam">
    <video id="video" playsinline muted></video>
    <div class="frame" id="frame"></div>
    <div class="cam-top">
      Наведите Data Matrix в рамку
      <div id="fps"></div>
    </div>
    <div class="cam-bottom">
      <div id="camResult">Ищу код…</div>
      <div class="cam-btns">
        <button id="torchBtn">🔦 Фонарик</button>
        <button id="closeBtn">✕ Готово</button>
      </div>
    </div>
  </div>
  <canvas id="canvas" hidden></canvas>

<script>
  // ===== НАСТРОЙКИ =====
  const API_URL = "https://script.google.com/macros/s/AKfycbzN4Fd358uX_loSJF9Jfixkt1KPOpRN4zPWI2FlrMruO8dlVu7B9dxJQhe9ETOpb5j2/exec";
  const SERIAL_LEN = 13;

  const tg = window.Telegram.WebApp;
  tg.expand();
  tg.ready();

  const u = tg.initDataUnsafe?.user;
  const agentName = u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : "Тестовый Агент";

  const $ = id => document.getElementById(id);
  const statusEl = $('status'), itemsList = $('itemsList');
  const camEl = $('cam'), video = $('video'), frameEl = $('frame'), camResult = $('camResult'), fpsEl = $('fps');
  const canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });

  const scannedKeys = new Set();
  const items = [];
  let nextId = 1;
  let stream = null, scanning = false, busy = false, torchOn = false;
  let lastRaw = "", lastRawTime = 0, attempts = 0;

  setStatus(tg.platform + " · v" + tg.version + " · " + agentName);

  window.addEventListener('error', e => {
    if (e.message && e.message !== 'Script error.') setStatus("JS ошибка: " + e.message);
  });

  // Проверяем, что библиотека загрузилась, и заранее грузим модуль распознавания
  if (typeof ZXingWASM === 'undefined') {
    setStatus("❌ Библиотека сканера не загрузилась. Проверьте интернет.");
  } else {
    try { ZXingWASM.prepareZXingModule({ fireImmediately: true }); } catch (e) {}
  }

  $('scanBtn').addEventListener('click', openCamera);
  $('closeBtn').addEventListener('click', closeCamera);
  $('torchBtn').addEventListener('click', toggleTorch);
  $('testBtn').addEventListener('click', () => {
    // Тестовый код в формате маркировки: проверяет связь с таблицей без камеры
    const GS = String.fromCharCode(29);
    const serial = ("T" + Date.now()).slice(-13);
    handleCode("01" + "04780000000017" + "21" + serial + GS + "91EE10" + GS + "92testsignature");
  });

  function setStatus(t) { statusEl.textContent = t; }

  // ===== Камера =====
  async function openCamera() {
    if (typeof ZXingWASM === 'undefined') {
      setStatus("❌ Библиотека сканера не загрузилась");
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 }, height: { ideal: 1080 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      // Непрерывная фокусировка, если камера поддерживает
      try {
        const track = stream.getVideoTracks()[0];
        const caps = track.getCapabilities ? track.getCapabilities() : {};
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch (e) {}

      camEl.classList.add('open');
      camResult.textContent = "Ищу код…";
      attempts = 0;
      scanning = true;
      scanLoop();
    } catch (e) {
      setStatus("❌ Нет доступа к камере: " + e.message + ". Разрешите камеру для Telegram в настройках телефона.");
    }
  }

  function closeCamera() {
    scanning = false;
    torchOn = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    camEl.classList.remove('open');
  }

  async function toggleTorch() {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    try {
      torchOn = !torchOn;
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    } catch (e) {
      camResult.textContent = "Фонарик не поддерживается на этом телефоне";
    }
  }

  // ===== Распознавание =====
  async function scanLoop() {
    if (!scanning) return;
    if (!busy && video.videoWidth) {
      busy = true;
      try {
        const vw = video.videoWidth, vh = video.videoHeight;
        const side = Math.floor(Math.min(vw, vh) * 0.7);
        const sx = Math.floor((vw - side) / 2), sy = Math.floor((vh - side) / 2);
        canvas.width = side; canvas.height = side;
        ctx.drawImage(video, sx, sy, side, side, 0, 0, side, side);
        const img = ctx.getImageData(0, 0, side, side);

        const res = await ZXingWASM.readBarcodes(img, {
          formats: ["DataMatrix"],
          tryHarder: true,
          textMode: "Plain",
          maxNumberOfSymbols: 1
        });

        attempts++;
        fpsEl.textContent = "камера " + vw + "×" + vh + " · попыток: " + attempts;

        if (res.length && res[0].isValid) onDetected(res[0].text);
      } catch (e) {
        camResult.textContent = "Ошибка распознавания: " + e.message;
      }
      busy = false;
    }
    setTimeout(scanLoop, 100);
  }

  function onDetected(rawText) {
    const now = Date.now();
    if (rawText === lastRaw && now - lastRawTime < 3000) return;
    lastRaw = rawText; lastRawTime = now;

    frameEl.classList.add('hit');
    setTimeout(() => frameEl.classList.remove('hit'), 500);
    handleCode(rawText);
  }

  // ===== Разбор GS1 =====
  function parseGs1(rawText) {
    const clean = String(rawText).replace(/^\]d2/, '').replace(/^\x1d/, '');
    const m = clean.match(/^01(\d{14})21([\s\S]+)$/);
    if (!m) return null;
    const rest = m[2];
    const gs = rest.indexOf('\x1d');
    const serial = gs >= 0 ? rest.slice(0, gs) : rest.slice(0, SERIAL_LEN);
    if (serial.length < 1 || serial.length > 20) return null;
    return { gtin: m[1], serial, key: m[1] + serial };
  }

  // ===== Отправка в таблицу =====
  async function sendScan(payload) {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const text = await r.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error("Сервер ответил не JSON (проверьте доступ развёртывания «Все»): " + text.slice(0, 80));
    }
  }

  async function handleCode(rawText) {
    const p = parseGs1(rawText);
    const shown = p ? p.key : String(rawText).replace(/\x1d/g, '<GS>').slice(0, 60);

    if (p && scannedKeys.has(p.key)) {
      haptic('error');
      camResult.textContent = "⚠️ Уже сканировали в этой сессии";
      addItem({ status: 'duplicate', code: p.key, msg: '⚠️ Уже сканировали в этой сессии', det: '' });
      return;
    }
    if (p) scannedKeys.add(p.key);
    haptic(p ? 'success' : 'warning');
    camResult.textContent = "⏳ Сохраняю… " + shown;

    const id = addItem({ status: 'loading', code: shown, msg: '⏳ Сохраняю...', det: '' });

    try {
      const res = await sendScan({
        raw: rawText,
        gtin: p ? p.gtin : "",
        serial: p ? p.serial : "",
        agent: agentName
      });
      if (res.status === 'duplicate') haptic('warning');
      if (res.status === 'error' && p) scannedKeys.delete(p.key);
      updateItem(id, res);
      camResult.textContent = res.message + (res.details ? " · " + res.details : "");
    } catch (err) {
      if (p) scannedKeys.delete(p.key);
      const msg = String(err.message || err);
      updateItem(id, { status: 'error', message: '⚠️ Ошибка связи', details: msg });
      camResult.textContent = "⚠️ Ошибка связи: " + msg;
    }
  }

  // ===== Список =====
  function addItem(item) {
    item.id = nextId++;
    items.unshift(item);
    render();
    return item.id;
  }

  function updateItem(id, res) {
    const it = items.find(i => i.id === id);
    if (it) { it.status = res.status; it.msg = res.message; it.det = res.details || ''; }
    render();
  }

  function render() {
    itemsList.innerHTML = items.map(i => `
      <div class="scan-item ${esc(i.status)}">
        <div class="code">${esc(i.code)}</div>
        <div class="msg">${esc(i.msg)}</div>
        <div class="det">${esc(i.det)}</div>
      </div>`).join('');
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function haptic(t) { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(t); }
</script>
</body>
</html>
